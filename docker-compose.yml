services:
  ollama-gemma4:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: gemma4:26b
    image: curated-ollama-gemma4:latest
    container_name: ollama-gemma4
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: gemma4:26b
      OPENCLAW_MODEL: gemma4:26b
      ENABLE_OPENCLAW: "0"
    restart: unless-stopped
